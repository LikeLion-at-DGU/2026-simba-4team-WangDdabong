<!-- store.html : 상점 페이지 ! -->
{% extends 'base_nav.html' %}
{% load static %}

{% block title %}상점{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/store.css' %}">
{% endblock %}

{% block content %}
<main class="store-container">

    <div class="store-title">STORE</div>

    <div class="worry-buy" data-item="worry_buy">
        <div class="worry-buy-icon">
            <div class="icon-bubble">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="34" viewBox="0 0 36 34" fill="none">
                    <path
                        d="M14.463 0.385004C23.4018 -0.763853 31.6047 5.5479 32.7597 14.485L34.8399 30.5826L18.613 32.6682C9.69835 33.8139 1.53764 27.5164 0.385698 18.6026C-0.766127 9.68906 5.54784 1.53083 14.463 0.385004Z"
                        stroke="#3A3A3A" stroke-width="0.5" />
                </svg>
                <span class="bubble-text">?</span>
            </div>
            <span class="worry-buy-label">1 고민 구매</span>
        </div>
        <div class="worry-buy-price">5 POINT</div>
    </div>

    <div class="yang-buy" data-item="babyang">
        <div class="yang-buy-info">
            <div class="yang-buy-name">
                <span class="lock">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="28" viewBox="0 0 25 28" fill="none">
                        <path d="M11.0005 10.0005C9.51901 3.20888 5.44493 -6.29938 1.00049 10.0005" stroke="black"
                            stroke-width="2" stroke-linecap="round" />
                        <rect x="4.50049" y="8.50049" width="20" height="19" rx="4.5" fill="#B0B0B0" stroke="black" />
                        <circle cx="12.0005" cy="17.8027" r="0.5" fill="black" stroke="black" />
                        <circle cx="18.0005" cy="17.8027" r="0.5" fill="black" stroke="black" />
                        <path d="M12.0005 21.8027C12.8338 22.5574 15.2005 23.6138 18.0005 21.8027" stroke="black"
                            stroke-linecap="round" />
                    </svg>
                </span>
                어린양
            </div>
            <div class="yang-buy-price">5 POINT</div>
            <div class="chance">하루 당 1 고민</div>
        </div>
        <div class="yang-buy-img">
            <img class="worryang1" src="../../static/images/worryang1.png" alt="워리양">
        </div>
    </div>

    <div class="yang-buy" data-item="veryang">
        <div class="yang-buy-info">
            <div class="yang-buy-name">
                <span class="lock">
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="28" viewBox="0 0 21 28" fill="none">
                        <path d="M3 10C5.22222 3.20839 11.3333 -6.29987 18 10" stroke="black" stroke-width="2"
                            stroke-linecap="round" />
                        <rect x="0.5" y="8.5" width="20" height="19" rx="4.5" fill="#B0B0B0" stroke="black" />
                        <circle cx="8" cy="17.8022" r="0.5" fill="black" stroke="black" />
                        <circle cx="14" cy="17.8022" r="0.5" fill="black" stroke="black" />
                        <path d="M14 22.8022C13.1667 22.0476 10.8 20.9911 8 22.8022" stroke="black"
                            stroke-linecap="round" />
                    </svg>
                </span>
                버리양
            </div>
            <div class="yang-buy-price">20 POINT</div>
            <div class="chance">하루 당 3 고민</div>
        </div>
        <div class="yang-buy-img">
            <img class="worryang2" src="../../static/images/store_2.png" alt="버리양">
        </div>
    </div>

    <div class="yang-buy" data-item="worryang">
        <div class="yang-buy-info">
            <div class="yang-buy-name">
                <span class="lock">
                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="28" viewBox="0 0 21 28" fill="none">
                        <path d="M3 10C5.22222 3.20839 11.3333 -6.29987 18 10" stroke="black" stroke-width="2"
                            stroke-linecap="round" />
                        <rect x="0.5" y="8.5" width="20" height="19" rx="4.5" fill="#B0B0B0" stroke="black" />
                        <circle cx="8" cy="17.8022" r="0.5" fill="black" stroke="black" />
                        <circle cx="14" cy="17.8022" r="0.5" fill="black" stroke="black" />
                        <path d="M14 22.8022C13.1667 22.0476 10.8 20.9911 8 22.8022" stroke="black"
                            stroke-linecap="round" />
                    </svg>
                </span>
                워리양
            </div>
            <div class="yang-buy-price">50 POINT</div>
            <div class="chance">하루 당 5 고민</div>
        </div>
        <div class="yang-buy-img">
            <img class="worryang3" src="../../static/images/store_3.png" alt="워리양">
        </div>
    </div>

    <button type="button" class="buy-btn" id="store-buy-btn" disabled>구매하기</button>

</main>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const items = document.querySelectorAll('.store-item');
        const buyBtn = document.getElementById('store-buy-btn');
        let selectedItem = null;

        items.forEach(function (item) {
            item.addEventListener('click', function () {
                if (selectedItem === item) {
                    item.classList.remove('selected');
                    selectedItem = null;
                } else {
                    if (selectedItem) {
                        selectedItem.classList.remove('selected');
                    }
                    item.classList.add('selected');
                    selectedItem = item;
                }

                buyBtn.disabled = !selectedItem;
            });
        });

        buyBtn.addEventListener('click', function () {
            if (!selectedItem) return;
            // TODO: 백엔드와 협의 필요 - 선택된 항목(selectedItem.dataset.item)을
            // 실제 구매 처리하는 엔드포인트로 POST 요청 필요
            console.log('구매 시도:', selectedItem.dataset.item);
        });
    });
</script>
{% endblock %}
