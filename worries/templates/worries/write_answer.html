<!-- 고민 답변 화면 -->
{% extends 'base_nav.html' %}
{% load static %}

{% block title %}고민 답변{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/write_answer.css' %}">
{% endblock %}

{% block content %}

<section class="reply-section">
     <h1 class="reply-page-title">WORRY REPLY</h1>

     <form method="post" class="reply-form">
          {% csrf_token %}

          <!-- 백에서 worry_id를 POST로도 받을 수 있게 같이 전달 -->
          <input type="hidden" name="worry_id" value="{{ worry_id }}">

          <!-- 안내 문구 -->
          <p class="reply-guide">
               도움을 줄 고민 내용입니다.
          </p>

          <!-- 고민 내용 미리보기 박스 -->
          <div class="textfield">
               <textarea id="worry-preview" class="worry-preview"
                    readonly>{{ worry.summary|default:worry.content }}</textarea>
          </div>

          <!-- 내가 이해한 상황 -->
          <div class="textfield">
               <p class="question-title">
                    자기가 인식한 상황
               </p>

               <textarea id="situation" name="situation" class="reply-content reply-small-content"
                    placeholder="이 고민을 어떤 상황으로 이해했는지 작성해주세요."></textarea>
          </div>

          <!-- 나라면 어떻게? -->
          <div class="textfield">
               <p class="question-title">
                    나라면 어떻게?
               </p>

               <textarea id="my-action" name="my_action" class="reply-content reply-small-content"
                    placeholder="나라면 어떻게 행동할지 작성해주세요."></textarea>
          </div>

          <!-- 당장 해봤으면 / 안 했으면 하는 행동 -->
          <div class="textfield">
               <p class="question-title">
                    당장 해봤으면 / 안 했으면 하는 행동?
               </p>

               <textarea id="recommendation" name="recommendation" class="reply-content reply-small-content"
                    placeholder="당장 해봤으면 하는 행동이나, 하지 않았으면 하는 행동을 작성해주세요.

욕설, 부정적인 언행 작성 시 경고를 받을 수 있습니다.
예쁜 말로 타인에게 도움을 드리면 감사하겠습니다."></textarea>
          </div>

          <button type="submit" class="submit-reply">
               답변 등록하기
          </button>
     </form>
</section>

{% endblock %}
