{% extends 'base.html' %}
{% load static %}

{% block title %}고민 답변{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/worry_reply.css' %}">
{% endblock %}

{% block content %}

<section class="reply-section">
    <h1 class="reply-page-title">WORRY REPLY</h1>

    <form class="reply-form" method="post">
        {% csrf_token %}

        <!-- 안내 문구 -->
        <p class="reply-guide">
            도움을 줄 고민 내용입니다.
        </p>

        <!-- 고민 내용 박스 -->
        <div class="textfield">
            <textarea id="worry-preview" name="worry_preview" class="worry-preview"
                placeholder="과제가 너무 많은데 시간은 없고 어쩌구"></textarea>
        </div>

        <!-- 답변 작성 -->
        <div class="textfield">
            <p class="question-title">
                답변 내용을 작성해주세요!
            </p>

            <textarea id="reply-content" name="content" class="reply-content" placeholder="작성 템플릿을 꼭 지켜주세요!

자기가 인식한 상황

나라면 어떻게?

당장 해봤으면 / 안했으면 하는 행동?


욕설, 부정적인 언행 작성 시 경고를 받을 수 있습니다.
예쁜 말로 타인에게 도움을 드리면 감사하겠습니다."></textarea>
        </div>

        <button type="submit" class="submit-reply">
            답변 등록하기
        </button>
    </form>
</section>

{% endblock %}
