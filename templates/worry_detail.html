{% extends 'base.html' %}
{% load static %}

{% block title %}고민 상세{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/worry_detail.css' %}">
{% endblock %}

{% block content %}

<section class="write-top-area">
    <div class="top-info">
        <span class="top-info-box">남은 고민 개수</span>
        <span class="top-info-box">포인트</span>
    </div>
</section>

<section class="write-section">
    <h1 class="write-page-title">ABOUT WORRY</h1>

    <div class="worry-form">

        <!-- 고민 키워드 -->
        <div class="textfield">
            <input id="worry-keyword" name="keyword" type="text" class="worry-keyword" placeholder="고민의 키워드">
        </div>

        <!-- 고민 상세 -->
        <div class="textfield">
            <p class="question-title">
                고민 상세
            </p>

            <div class="detail-content-box">
                <input id="worry-title" name="title" type="text" class="detail-title-input" placeholder="고민 주제">

                <textarea id="worry-content" name="content" class="detail-content-input" placeholder="고민 내용"></textarea>

                <div class="detail-stamp-area">
                    <span class="stamp-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="26" viewBox="0 0 22 26" fill="none">
                            <path
                                d="M12.4855 2.71507L7.37931 3.11758C4.62643 3.33458 2.58178 5.74125 2.81247 8.49302L3.6482 18.4622C3.87889 21.214 6.29755 23.2688 9.05043 23.0518L14.1566 22.6493C16.9095 22.4323 18.9542 20.0256 18.7235 17.2739L17.8877 7.30467C17.6571 4.5529 15.2384 2.49806 12.4855 2.71507Z"
                                fill="#C89B25" />
                            <circle cx="9.3" cy="11.7" r="0.9" fill="#3A3A3A" />
                            <circle cx="14.1" cy="11" r="0.9" fill="#3A3A3A" />
                            <path d="M11.2 14.8C12.1 15.1 14.1 15.2 15 14.2" stroke="#3A3A3A" stroke-width="1.5"
                                stroke-linecap="round" />
                        </svg>
                    </span>

                    <span class="stamp-count">1</span>

                    <span class="bookmark-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="31" viewBox="0 0 24 31" fill="none">
                            <path d="M4 3C4 1.89543 4.89543 1 6 1H18C19.1046 1 20 1.89543 20 3V29L12 23L4 29V3Z"
                                fill="#FFFFFF" />
                        </svg>
                    </span>
                </div>
            </div>
        </div>

        <a href="{% url 'worry_reply' %}" class="answer-write-button">
            고민 답변 작성하기
        </a>

    </div>
</section>

{% endblock %}
