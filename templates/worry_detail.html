{% extends 'base.html' %}
{% load static %}

{% block title %}고민 상세{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/worry_detail.css' %}">
{% endblock %}

{% block content %}

<section class="page">

    <!-- TOP TITLE -->
    <h1 class="title">ABOUT WORRY</h1>

    <!-- FORM (폼 제거하고 그냥 구조만 유지) -->
    <div class="form">

        <!-- KEYWORD -->
        <input class="input-box" type="text" placeholder="고민의 키워드">

        <!-- DETAIL TITLE -->
        <div class="section-label">고민 상세</div>
        <input class="input-box" type="text" placeholder="고민 주제">

        <!-- CONTENT CARD -->
        <div class="content-card">
            <textarea class="content-textarea" placeholder="고민 내용"></textarea>

            <!-- stamp -->
            <div class="stamp-area">
                <span class="stamp-icon">
                    <img src="{% static 'images/yellowstamp.png' %}" alt="스탬프">
                </span>
                <span class="stamp-count">1</span>

                <span class="bookmark-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="31" viewBox="0 0 24 31" fill="none">
                        <path d="M4 3C4 1.89543 4.89543 1 6 1H18C19.1046 1 20 1.89543 20 3V29L12 23L4 29V3Z"
                            fill="#FFFFFF" />
                    </svg>
                </span>
            </div>
        </div>

        <!-- BUTTON → LINK로 변경 -->
        <a href="{% url 'worry_reply' %}" class="submit-btn">
            고민 답변 작성하기
        </a>

    </div>

</section>

{% endblock %}
