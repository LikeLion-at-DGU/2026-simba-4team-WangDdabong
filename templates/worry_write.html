{% extends 'base.html' %}
{% load static %}

{% block title %}고민 작성{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/worry_write.css' %}">
{% endblock %}

{% block content %}


<section class="write-section">
    <h1 class="write-page-title">WORRY POST</h1>

    <form class="worry-form" method="post">
        {% csrf_token %}

        <div class="keyword-field">
            <button type="button" class="keyword-select" id="keywordSelectBtn">
                <span id="keywordSelectedText">고민의 키워드를 선택해주세요!</span>

                <svg class="keyword-arrow" id="keywordArrow" xmlns="http://www.w3.org/2000/svg" width="14" height="8"
                    viewBox="0 0 14 8" fill="none">
                    <path d="M1 1L7 7L13 1" stroke="#3A3A3A" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>

            <div class="keyword-dropdown" id="keywordDropdown">
                <div class="keyword-group">
                    <p class="keyword-group-title">성장 / 진로</p>
                    <div class="keyword-chip-wrap">
                        <button type="button" class="keyword-chip" data-value="취업">취업</button>
                        <button type="button" class="keyword-chip" data-value="학점">학점</button>
                        <button type="button" class="keyword-chip" data-value="자격증">자격증</button>
                        <button type="button" class="keyword-chip" data-value="대외활동">대외활동</button>
                        <button type="button" class="keyword-chip" data-value="창업">창업</button>
                        <button type="button" class="keyword-chip" data-value="학업">학업</button>
                    </div>
                </div>

                <div class="keyword-group">
                    <p class="keyword-group-title">경제 / 현실</p>
                    <div class="keyword-chip-wrap">
                        <button type="button" class="keyword-chip" data-value="알바">알바</button>
                        <button type="button" class="keyword-chip" data-value="자취">자취</button>
                        <button type="button" class="keyword-chip" data-value="학자금">학자금</button>
                        <button type="button" class="keyword-chip" data-value="소비">소비</button>
                        <button type="button" class="keyword-chip" data-value="물가">물가</button>
                    </div>
                </div>

                <div class="keyword-group">
                    <p class="keyword-group-title">관계 / 자아</p>
                    <div class="keyword-chip-wrap">
                        <button type="button" class="keyword-chip" data-value="연애">연애</button>
                        <button type="button" class="keyword-chip" data-value="친구">친구</button>
                        <button type="button" class="keyword-chip" data-value="인간관계">인간관계</button>
                        <button type="button" class="keyword-chip" data-value="멘탈">멘탈</button>
                    </div>
                </div>

                <div class="keyword-group">
                    <p class="keyword-group-title">사회 / 시선</p>
                    <div class="keyword-chip-wrap">
                        <button type="button" class="keyword-chip" data-value="정책">정책</button>
                        <button type="button" class="keyword-chip" data-value="환경">환경</button>
                        <button type="button" class="keyword-chip" data-value="젠더">젠더</button>
                        <button type="button" class="keyword-chip" data-value="이슈">이슈</button>
                    </div>
                </div>

                <div class="keyword-group">
                    <p class="keyword-group-title">기타</p>
                    <div class="keyword-chip-wrap">
                        <button type="button" class="keyword-chip" data-value="잡다구리">잡다구리</button>
                    </div>
                </div>
            </div>

            <input type="hidden" name="keyword" id="keywordValue">
        </div>

        <div class="textfield">
            <p class="question-title">
                오늘의 고민은 무엇인가요?
            </p>
            <input id="worry-title" name="title" type="text" class="worry-title" placeholder="고민 주제">
        </div>

        <div class="textfield">
            <textarea id="worry-content" name="content" class="worry-content" placeholder="고민 내용을 작성해주세요"></textarea>
        </div>


        <div class="mbti-field">
            <p class="question-title">
                어떤 성격 유형에게 답변을 받을까요?
            </p>

            <div class="mbti-field">
                <p class="mbti-question-title"></p>

                <div class="mbti-options">
                    <div class="mbti-toggle" data-group="ei" data-state="0">
                        <button type="button" class="mbti-btn active" data-value="E">E</button>
                        <button type="button" class="mbti-btn" data-value="I">I</button>
                    </div>

                    <div class="mbti-toggle" data-group="sn" data-state="0">
                        <button type="button" class="mbti-btn active" data-value="S">S</button>
                        <button type="button" class="mbti-btn" data-value="N">N</button>
                    </div>

                    <div class="mbti-toggle" data-group="ft" data-state="0">
                        <button type="button" class="mbti-btn active" data-value="F">F</button>
                        <button type="button" class="mbti-btn" data-value="T">T</button>
                    </div>

                    <div class="mbti-toggle" data-group="pj" data-state="0">
                        <button type="button" class="mbti-btn active" data-value="P">P</button>
                        <button type="button" class="mbti-btn" data-value="J">J</button>
                    </div>
                </div>

                <input type="hidden" name="mbti" id="mbti-value" value="ISFP">
            </div>
        </div>

        <a href="{% url 'worry_list' %}" class="submit-worry">
            고민 등록하기
        </a>
    </form>
</section>

<script>
    const mbtiToggles = document.querySelectorAll(".mbti-toggle");
    const mbtiValueInput = document.querySelector("#mbti-value");

    function updateMbtiValue() {
        let mbti = "";

        mbtiToggles.forEach((toggle) => {
            const activeButton = toggle.querySelector(".mbti-btn.active");

            if (activeButton) {
                mbti += activeButton.dataset.value;
            } else {
                mbti += "X";
            }
        });

        mbtiValueInput.value = mbti;
    }

    mbtiToggles.forEach((toggle) => {
        toggle.addEventListener("click", () => {
            const buttons = toggle.querySelectorAll(".mbti-btn");

            let state = Number(toggle.dataset.state);

            // 0: 첫 번째 선택, 1: 두 번째 선택, 2: off
            state = (state + 1) % 3;
            toggle.dataset.state = state;

            buttons.forEach((button) => {
                button.classList.remove("active");
            });

            toggle.classList.remove("off");

            if (state === 0) {
                buttons[0].classList.add("active");
            } else if (state === 1) {
                buttons[1].classList.add("active");
            } else {
                toggle.classList.add("off");
            }

            updateMbtiValue();
        });
    });

    const keywordField = document.querySelector(".keyword-field");
    const keywordSelectBtn = document.querySelector("#keywordSelectBtn");
    const keywordSelectedText = document.querySelector("#keywordSelectedText");
    const keywordValueInput = document.querySelector("#keywordValue");
    const keywordChips = document.querySelectorAll(".keyword-chip");

    keywordSelectBtn.addEventListener("click", () => {
        keywordField.classList.toggle("open");
    });

    keywordChips.forEach((chip) => {
        chip.addEventListener("click", () => {
            const selectedKeyword = chip.dataset.value;

            keywordChips.forEach((item) => {
                item.classList.remove("active");
            });

            chip.classList.add("active");

            keywordSelectedText.textContent = selectedKeyword;
            keywordValueInput.value = selectedKeyword;
            keywordSelectBtn.classList.add("selected");

            keywordField.classList.remove("open");
        });
    });

    document.addEventListener("click", (event) => {
        if (!keywordField.contains(event.target)) {
            keywordField.classList.remove("open");
        }
    });
</script>

{% endblock %}
