<script>
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".reaction-icons").forEach(area => {
            const up = area.querySelector(".up-btn");
            const down = area.querySelector(".down-btn");

            up.addEventListener("click", () => {
                up.classList.toggle("active");
                down.classList.remove("active");
            });

            down.addEventListener("click", () => {
                down.classList.toggle("active");
                up.classList.remove("active");
            });
        });
    });

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".reply-check-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                btn.classList.toggle("active");
            });
        });
    });
</script>
